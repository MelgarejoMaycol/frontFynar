name: Fynar Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Formatting report
        run: npm run format:check
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fynar_test
          POSTGRES_PASSWORD: fynar_test_password
          POSTGRES_DB: fynar_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fynar_test -d fynar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3000/api/v1
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters
      DISABLE_AUTH_RATE_LIMITS: "true"

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontFynar

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: MelgarejoMaycol/BackFynar
          path: BackFynar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: BackFynar
        run: npm ci

      - name: Prepare QA database
        working-directory: BackFynar
        run: |
          npm run qa:migrate
          npm run qa:seed
          npm run qa:e2e:seed

      - name: Install frontend dependencies
        working-directory: frontFynar
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontFynar
        run: npx playwright install --with-deps chromium

      - name: Run current end-to-end smoke suite
        working-directory: frontFynar
        run: npm run e2e:ci
